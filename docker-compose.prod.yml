services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"   # → expose ke host untuk akses via DBeaver/pgAdmin di VPS
    networks:
      - portfolio_net

  # ─── NestJS API ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portfolio_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Browser origin allowed by CORS (the Next.js frontend)
      FRONTEND_URL: ${FRONTEND_URL}
      # Shared cookie domain so the refresh_token cookie is visible to the
      # web app's middleware when API and web live on different subdomains
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"   # → Nginx proxy: http://127.0.0.1:3001
    networks:
      - portfolio_net

  # ─── Next.js Web ───────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Public URL of the API as seen from the BROWSER (goes through Nginx)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: portfolio_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side API URL (goes through Docker internal network)
      API_URL: http://api:3001
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"   # → Nginx proxy: http://127.0.0.1:3000
    networks:
      - portfolio_net

volumes:
  postgres_data:
  uploads_data:

networks:
  portfolio_net:
    driver: bridge
